name: Descargar fotos de producto
on:
  push:
    paths: ['_fuentes/urls.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fotos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p _fuentes/img
          while read name url; do
            ext="${url##*.}"
            curl -sSfL --retry 3 -o "_fuentes/img/$name.$ext" "$url" || echo "FALLO $name $url"
          done < _fuentes/urls.txt
          ls _fuentes/img | wc -l
      - run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add _fuentes/img
          git commit -m "Fotos de producto originales (temporal)" || exit 0
          git push
